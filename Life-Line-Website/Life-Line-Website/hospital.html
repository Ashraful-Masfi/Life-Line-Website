<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Listings - Life Line</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="hospital.css">
</head>
<body>
    <!-- Hospital Header -->
    <header class="hospital-header">
        <div class="container">
            <h1 class="hospital-title">🏥 Top Hospitals in Bangladesh</h1>
            <p class="hospital-subtitle">Find the best medical care near you</p>
            <div class="search-bar">
                <input type="text" id="hospitalSearch" placeholder="Search hospitals by name or location..." class="search-input">
                <button class="search-btn">Search</button>
            </div>
        </div>
    </header>

    <!-- Hospitals Grid -->
    <section class="hospitals-section">
        <div class="container">
            <div class="hospitals-grid" id="hospitalsGrid">
                <!-- Hospitals will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Back to Home -->
    <div class="back-home">
        <a href="index.html" class="back-btn">← Back to Life Line</a>
    </div>

    <script src="hospital.js"></script>
</body>
</html>
